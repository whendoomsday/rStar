mode: "mcts"
model_dir: ""
few_shot_path: "./rstar_deepthink/few_shots/few_shots.json"
prompt_path: "./rstar_deepthink/few_shots/sft_prompt.json"
prompt_wrap: "rstar"
result_unwrap: "rstar"
step_delim: "\n"
stop: ["<end_of_step>", "<end_of_code>", "<end_of_answer>"]

# Search
max_depth: 12
iterations: 8
n_generate_sample: 8
best_of: 8
c_puct: 2
is_sampling: False

# Disable code execution tool
use_code_tool: False
errors_threshold: 0

# Use simple MCTS selection score when RM is not provided.
need_value_func: False
update_leaf_value: False

# Generation
temperature: 0.8
top_p: 1.0
max_tokens: 1024
max_model_len: 4096
batch_size: 256
